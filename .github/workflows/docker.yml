name: Build Docker image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - Microsoft365_E5_Renew_X.zip
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract application
        run: |
          set -euo pipefail
          mkdir -p /tmp/renewx-extract
          unzip -q Microsoft365_E5_Renew_X.zip -d /tmp/renewx-extract
          dll=$(find /tmp/renewx-extract -type f -name Microsoft365_E5_Renew_X.dll -print -quit)
          if [ -z "$dll" ]; then
            echo "::error::Microsoft365_E5_Renew_X.dll not found in ZIP"
            exit 1
          fi
          mkdir -p Microsoft365_E5_Renew_X
          cp -a "$(dirname "$dll")/." Microsoft365_E5_Renew_X/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: renewx:smoke-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test container
        shell: bash
        run: |
          set -euo pipefail

          test_dir=$(mktemp -d)
          container_name="renewx-smoke"
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::group::Container diagnostic logs"
              docker logs "$container_name" 2>&1 || true
              docker inspect "$container_name" --format '{{json .State}}' || true
              echo "::endgroup::"
            fi
            docker rm -f "$container_name" >/dev/null 2>&1 || true
            sudo rm -rf -- "$test_dir" || true
          }
          trap cleanup EXIT

          # The test uses isolated data and an ephemeral password.
          cp -a Deploy "$test_dir/Deploy"
          mkdir -p "$test_dir/appdata"
          password=$(openssl rand -hex 24)
          sed -i "s|<LoginPassword>[^<]*</LoginPassword>|<LoginPassword>$password</LoginPassword>|" "$test_dir/Deploy/Config.xml"

          docker run -d --name "$container_name" \
            -p 127.0.0.1:8066:8066 \
            -v "$test_dir/Deploy:/renewx/Deploy" \
            -v "$test_dir/appdata:/renewx/appdata" \
            renewx:smoke-test

          # Require a running process and a non-empty successful login page.
          for attempt in {1..45}; do
            if [ "$(docker inspect --format '{{.State.Running}}' "$container_name")" != "true" ]; then
              echo "::error::Container exited before becoming ready"
              exit 1
            fi

            if curl -fsSL --max-time 5 \
              -o "$test_dir/login.html" \
              http://127.0.0.1:8066/Admin/Login 2>/dev/null \
              && [ -s "$test_dir/login.html" ]; then
              echo "Smoke test passed: container running, login page available on port 8066"
              exit 0
            fi

            sleep 2
          done

          echo "::error::Login page did not become ready within the test window"
          exit 1

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
