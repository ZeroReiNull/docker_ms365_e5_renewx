name: Build Docker image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - Microsoft365_E5_Renew_X.zip
      - .github/workflows/docker.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract application
        run: |
          set -euo pipefail
          mkdir -p /tmp/renewx-extract
          unzip -q Microsoft365_E5_Renew_X.zip -d /tmp/renewx-extract
          dll=$(find /tmp/renewx-extract -type f -name Microsoft365_E5_Renew_X.dll -print -quit)
          if [ -z "$dll" ]; then
            echo "::error::Microsoft365_E5_Renew_X.dll not found in ZIP"
            exit 1
          fi
          mkdir -p Microsoft365_E5_Renew_X
          cp -a "$(dirname "$dll")/." Microsoft365_E5_Renew_X/

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
